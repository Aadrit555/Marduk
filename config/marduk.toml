# MARDUK Platform Configuration

[server]
host = "127.0.0.1"
port = 8080
request_timeout_secs = 120

[gpu]
poll_interval_ms = 500
min_vram_headroom_mb = 512
enable_nvml = true

[scheduler]
max_queue_per_worker = 64
weight_queue = 1.0
weight_vram = 0.8
weight_compute = 0.5
affinity_bonus = 2.0
enable_learned = false
shadow_mode = true

[workers]
auto_restart = true
heartbeat_timeout_ms = 5000
default_model = "mistral-7b-instruct"

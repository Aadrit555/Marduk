[workspace]
members = [
    "crates/marduk-core",
    "crates/marduk-nvml",
    "crates/marduk-worker",
    "crates/marduk-scheduler",
    "crates/marduk-learned",
    "crates/marduk-api",
    "crates/marduk-bench",
    "crates/marduk-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aadrit <aadrit@marduk.ai>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Aadrit555/Marduk"
description = "MARDUK: Intelligent GPU Inference Orchestration and Resource Management Platform"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["macros", "tokio"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "default-tls"] }
sysinfo = "0.31"
parking_lot = "0.12"

marduk-core = { path = "crates/marduk-core" }
marduk-nvml = { path = "crates/marduk-nvml" }
marduk-worker = { path = "crates/marduk-worker" }
marduk-scheduler = { path = "crates/marduk-scheduler" }
marduk-learned = { path = "crates/marduk-learned" }
marduk-api = { path = "crates/marduk-api" }
marduk-bench = { path = "crates/marduk-bench" }
